<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Menu page</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="CSS/main.css">
    <link rel="stylesheet" href="CSS/menu.css">
</head>
<body>
    <header class="header">
        <nav class="navbar container">

            <a href="index.html" class="logo">
                flour & co.
                <span>SA BAKERY</span>
                </a>

            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html" class="active">Our Menu</a></li>
                <li><a href="about.html">Our Story</a></li>
                <li><a href="collection.html">Collection</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>

        </nav>

    </header>

    <section class="menu-hero">

        <div class="menu-hero-content container">

            <span class="eyebrow">
                DISCOVER OUR SELECTION
            </span>

            <h1>Our Bakery <em>Menu.</em></h1>

            <p>
                Freshly baked goodness for every occasion.
            </p>

            <div class="hero-divider"></div>

        </div>

    </section>


<!-- PRODUCT CATALOGUE -->
<section class="menu-section">

    <div class="container">

        <!-- SEARCH AND SORTING -->
        <div class="menu-toolbar">

            <div class="search-box">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                    type="search"
                    id="productSearch"
                    placeholder="Search our menu..."
                    aria-label="Search products"
                >

            </div>

            <div class="sort-box">

                <label for="sortProducts">Sort by:</label>

                <select id="sortProducts">
                    <option value="default">Default sorting</option>
                    <option value="price-low">Price: Low to high</option>
                    <option value="price-high">Price: High to low</option>
                    <option value="name-az">Name: A-Z</option>
                    <option value="name-za">Name: Z-A</option>
                </select>

            </div>

        </div>

        <!-- CATEGORY FILTERS -->
        <div class="menu-filters">

            <button class="menu-filter active"
                    data-category="all">
                All Products
            </button>

            <button class="menu-filter"
                    data-category="bread">
                Bread
            </button>

            <button class="menu-filter"
                    data-category="pastries">
                Pastries
            </button>

            <button class="menu-filter"
                    data-category="sweet">
                Sweet Treats
            </button>

            <button class="menu-filter"
                    data-category="savoury">
                Savoury
            </button>

        </div>

        <!-- PRODUCT COUNT -->
        <div class="menu-results">

            <p id="productCount" aria-live="polite">
                Showing 0 products
            </p>

            <button id="clearFilters" class="clear-filters">
                Clear filters
            </button>

        </div>

        <!-- PRODUCT GRID -->
        <div class="menu-product-grid" id="menuProductGrid">

            <!-- Products generated by JavaScript -->

        </div>

        <!-- EMPTY STATE -->
        <div class="empty-state" id="emptyState" hidden>

            <i class="fa-solid fa-magnifying-glass"></i>

            <h2>No products found</h2>

            <p>Try another search or select a different category.</p>

            <button id="resetFilters" class="reset-btn">
                View All Products
            </button>

        </div>

    </div>

</section>

    <script src="JS/products.js" defer></script>
    <script src="JS/menu.js" defer></script>
    <script src="JS/main.js" defer></script>
</body>
</html>
